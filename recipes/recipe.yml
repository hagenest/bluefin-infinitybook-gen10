---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bluefin-infinitybook-gen10

description: ublue/bluefin for the tuxedo infinitybook pro 14 gen 10

base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest

modules:
  - type: files
    files:
      - source: system # default, not used atm
        destination: /

  - type: kargs
    arch: x86_64
    kargs:
      - i8042.reset
      - i8042.nomux
      - i8042.nopnp
      - i8042.noloop

  - type: dnf
    repos:
      copr:
        - name: gladion136/tuxedo-drivers-kmod
          chroot: fedora-43-x86_64
        - name: atul977/tuxedo-rs 
          chroot: fedora-43-x86_64
        - name: jurkovic-nikola/OpenLinkHub
          chroot: OpenLinkHub


    install:
      packages:
       - tuxedo-drivers-kmod
       - tailord
       - tailor-gui

  - type: signing
